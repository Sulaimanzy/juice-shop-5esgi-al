name: sast

on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.145.0 \
            semgrep scan --config=p/ci --config=.semgrep/ \
              --sarif --output=semgrep.sarif --error --metrics=off \
              lib routes models

      - name: Upload SARIF vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Seuil de blocage
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "::error::Semgrep a remonte des findings bloquants"
          exit 1

  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks - historique complet
        id: gitleaks-history
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --report-format sarif --report-path /repo/gitleaks-history.sarif \
              --exit-code 1 --redact /repo

      - name: Gitleaks - controle du push
        id: gitleaks-diff
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Publier le rapport gitleaks historique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history-sarif
          path: gitleaks-history.sarif
          if-no-files-found: error

      - name: Seuil de blocage des secrets
        if: steps.gitleaks-history.outcome == 'failure' || steps.gitleaks-diff.outcome == 'failure'
        run: |
          echo "::error::Gitleaks a remonte des secrets bloquants"
          exit 1
