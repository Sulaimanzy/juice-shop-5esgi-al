name: supply-chain

on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  deps-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit
        id: npm-audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: osv-scanner
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            scan
            source
            --lockfile=package-lock.json

      - name: Seuil de blocage
        if: steps.npm-audit.outcome == 'failure' || steps.osv.outcome == 'failure'
        run: |
          echo "::error::Vulnerabilite high ou critical dans les dependances"
          exit 1

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build de l'image
        run: docker build -f Dockerfile.ci -t juice-shop:ci .
      - name: Trivy image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: juice-shop:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
          # sans ce reglage, trivy-action ignore "severity" pour le SARIF et publie tout (LOW, MEDIUM compris)
          limit-severities-for-sarif: true
      - name: Upload SARIF vers l'onglet Security
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Seuil de blocage
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Vulnerabilite high ou critical dans l'image"
          exit 1
